# Local services for the API: Postgres 16 (PostGIS, pg_trgm) and Redis.
#   npm run db:up      start them in the background
#   npm run db:down    stop them (data is kept in the named volumes)
#   npm run db:reset   stop them and delete the data
# Ports bind to 127.0.0.1 only, so nothing outside this machine can reach them.
name: zamani

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: zamani
      POSTGRES_PASSWORD: zamani
      POSTGRES_DB: zamani
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the volume is first created.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamani -d zamani"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
